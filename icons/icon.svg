<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Improvement mark: three neon chevrons, glow built from layered
       concentric strokes (increasing width, decreasing opacity) rather than
       an SVG blur filter — this renders identically in-browser, in a canvas,
       and in PowerShell's System.Drawing, so the PNG icons regenerated from
       this file match it exactly. -->
